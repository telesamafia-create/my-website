<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin:0; background:#0b0b0b; color:#fff; font:14px system-ui; }

.cell .box { width:220px; height:220px; display:grid; place-items:center; background:#000; border:1px solid #333; }
.cell svg { width:180px; height:180px; fill:#fff; }
.cell img { width:180px; height:180px; }
.cell b { display:block; margin-top:8px; font-weight:500; color:#aaa; }

async function load(name) {
  const r = await fetch(`https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/${name}.svg`);

  return { viewBox: t.match(/viewBox="([^"]+)"/)[1], d: t.match(/ d="([^"]+)"/)[1] };
